<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telescope Distribution Map — Bangladesh</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #f5f0e8;
      --surface:     #faf7f2;
      --surface2:    #f0ebe0;
      --border:      #c8b89a;
      --border-hi:   #a8926e;
      --text-h:      #2c1f0e;
      --text-b:      #5a4228;
      --text-muted:  #8b6f4e;
      --gold:        #b8860b;
      --active-pill: #2e7d32;
      --active-bg:   #e8f5e9;

      /* Fallback style tokens for structural blocks */
      --c0: #ede8dc;
      --c1: #f5d87a;
      --c2: #e8a020;
      --c3: #d4620a;
      --c4: #b83210;
      --c5: #7a1020;
    }

    /* ── Dark mode rule matching your exact original structural engine ── */
    html.dark {
      --bg:          #0f1923;
      --surface:     #162030;
      --surface2:    #1e2d3e;
      --border:      #2a3f55;
      --border-hi:   #3a5570;
      --text-h:      #e8f4ff;
      --text-b:      #9bb5cc;
      --text-muted:  #5a7a96;
      --gold:        #f5c842;
      --active-pill: #81c784;
      --active-bg:   #1b321f;

      --c0: #1a2d40;
      --c1: #3a2010;
      --c2: #6a3010;
      --c3: #8a2808;
      --c4: #a82010;
      --c5: #c01020;
    }

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-b); transition: background .3s, color .3s; }

    /* Fullscreen initial loading component mask */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3.5px solid var(--border);
      border-top: 3.5px solid var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1.25rem;
    }
    .loading-text {
      color: var(--text-h); font-weight: 500; font-size: 1rem; text-align: center; line-height: 1.5; padding: 0 2rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ── Main Layout (Restored completely to your centered max-960px envelope) ── */
    .page { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; display: flex; flex-direction: column; gap: 1.75rem; }

    /* ── Header Mappings ── */
    header { text-align: center; position: relative; }
    .header-eyebrow {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .72rem; font-weight: 500; letter-spacing: .14em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: .75rem;
    }
    .header-eyebrow::before, .header-eyebrow::after {
      content: ''; display: block; width: 24px; height: 1px; background: var(--gold); opacity: .5;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      font-weight: 900;
      color: var(--text-h);
      letter-spacing: -.02em;
      line-height: 1.15;
    }
    header p { margin-top: .5rem; font-size: .875rem; font-weight: 300; color: var(--text-muted); }

    /* ── Summary Statistics Dashboard ── */
    .stats { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem 1.75rem;
      display: flex; flex-direction: column; align-items: center;
      gap: .15rem; min-width: 160px;
    }
    .stat-card .num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; font-weight: 700;
      line-height: 1; letter-spacing: -.02em;
    }
    .stat-card .num.gold { color: var(--gold); }
    .stat-card .lbl { font-size: .72rem; font-weight: 400; color: var(--text-muted); text-align: center; line-height: 1.3; }

    /* ── Map Card Canvas Frame ── */
    .map-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 50px rgba(0,0,0,.08);
    }
    #map {
      width: 100%; height: clamp(360px, 60vw, 580px);
      background: var(--bg);
    }

    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      box-shadow: 0 2px 12px rgba(0,0,0,.1) !important;
      border-radius: 10px !important; overflow: hidden;
    }
    .leaflet-control-zoom a {
      color: var(--text-h) !important;
      background: var(--surface2) !important;
      font-size: 1rem !important;
      line-height: 30px !important; width: 30px !important; height: 30px !important;
    }
    .leaflet-control-zoom a:hover { background: var(--border) !important; }

    /* Tooltip styling rules matching your design context precisely */
    .leaflet-tooltip {
      background: var(--surface) !important; border: 1px solid var(--border-hi) !important;
      border-radius: 8px !important; color: var(--text-h) !important;
      font-family: 'DM Sans', sans-serif !important;
      font-size: .78rem !important; padding: .4rem .7rem !important;
      box-shadow: 0 4px 16px rgba(0,0,0,.15) !important;
    }
    .leaflet-tooltip::before { display: none !important; }
    .tt-name { font-weight: 500; color: var(--text-h); }
    .tt-counts { margin-top: 3px; font-size: .75rem; color: var(--gold); font-weight: 500; }
    .tt-empty { color: var(--text-muted); font-style: italic; font-size: .73rem; }

    /* ── Legend Strip Configurations ── */
    .legend {
      padding: .75rem 1.2rem;
      background: var(--surface2);
      border-top: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
    }
    .legend-label { font-size: .68rem; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--text-muted); }
    .legend-item  { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--text-b); }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    /* ── Metadata Info Display Box Beneath Map ── */
    #info-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem 1.75rem;
      min-height: 130px;
      box-shadow: 0 12px 50px rgba(0,0,0,.06);
      position: relative; overflow: hidden;
      transition: border-color .25s;
    }
    #info-panel::before {
      content: ''; position: absolute;
      left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--gold); border-radius: 4px 0 0 4px;
      opacity: 0; transition: opacity .3s;
    }
    #info-panel.active::before { opacity: 1; }
    #info-panel.active { border-color: var(--border-hi); }

    .panel-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 90px; gap: .5rem; color: var(--text-muted);
    }
    .panel-empty svg { opacity: .25; }
    .panel-empty span { font-size: .84rem; font-weight: 300; letter-spacing: .03em; }

    .panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .panel-name { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--text-h); font-weight: 700; line-height: 1.15; }
    .panel-div  { font-size: .78rem; color: var(--text-muted); margin-top: .2rem; }
    
    .pill-badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700;
      padding: 0.35rem 0.8rem; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pill-badge.active { color: var(--active-pill); background: var(--active-bg); border: 1px solid rgba(0,150,0,0.15); }
    .pill-badge.zero { color: var(--text-muted); background: var(--surface2); }

    .details-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem;
    }
    .detail-card {
      background: var(--surface2); padding: 0.75rem 1rem; border-radius: 8px; border-left: 3px solid var(--gold);
    }
    .detail-lbl {
      font-size: 0.68rem; text-transform: uppercase; font-weight: 500; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.25rem;
    }
    .detail-value { font-size: 0.88rem; color: var(--text-h); font-weight: 400; line-height: 1.4; }

    /* Separators for multiple rows inside metadata blocks */
    .multi-item { padding-bottom: 0.2rem; margin-bottom: 0.2rem; border-bottom: 1px dashed rgba(0,0,0,0.06); }
    .multi-item:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
    html.dark .multi-item { border-bottom-color: rgba(255,255,255,0.06); }

    .panel-no-data {
      display: flex; align-items: center; gap: .5rem; justify-content: center;
      color: var(--text-muted); font-size: .88rem; font-style: italic; padding: 2rem 0;
    }
    .panel-no-data svg { fill: currentColor; opacity: 0.5; }

    @media (max-width: 520px) {
      .page { padding: 1.4rem .875rem 3rem; }
      #info-panel { padding: 1.25rem 1.2rem; }
      .panel-name { font-size: 1.3rem; }
      .details-grid { grid-template-columns: 1fr; }
    }
  </style>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      document.getElementById('toggle-icon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('toggle-label').textContent = isDark ? 'Light' : 'Dark';
      localStorage.setItem('noc_theme', isDark ? 'dark' : 'light');
      if (typeof geojsonLayer !== 'undefined' && geojsonLayer) {
        geojsonLayer.setStyle(styleFeat);
      }
    }
    (function() {
      const saved = localStorage.getItem('noc_theme');
      if (saved === 'dark') { document.documentElement.classList.add('dark'); }
    })();
  </script>
</head>
<body>

  <button id="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:1rem;right:1rem;z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:.45rem 1rem;cursor:pointer;font-size:.8rem;font-weight:500;color:var(--text-b);display:flex;align-items:center;gap:.5rem;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:all .25s;font-family:'DM Sans',sans-serif;">
    <span id="toggle-icon">🌙</span>
    <span id="toggle-label">Dark</span>
  </button>

  <div class="page">
    <header>
      <div class="header-eyebrow">[Your Organization Name]</div>
      <h1>Telescope Distribution Map — Bangladesh</h1>
      <p>Registered telescopes by district · Click any region to see details</p>
    </header>

    <div class="stats" id="summary-stats">
      <div class="stat-card">
        <div class="num gold" id="stat-total">—</div>
        <div class="lbl">Total Telescopes</div>
      </div>
      <div class="stat-card">
        <div class="num gold" id="stat-covered">—</div>
        <div class="lbl">Districts Covered</div>
      </div>
    </div>

    <div class="map-card">
      <div id="map"></div>
      <div class="legend">
        <span class="legend-label">Telescopes</span>
        <div class="legend-item"><div class="legend-swatch" style="background:#ede8dc;border:1px solid var(--border)"></div>None</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#f5d87a"></div>1</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#e8a020"></div>2–3</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#d4620a"></div>4–6</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#b83210"></div>7–9</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#7a1020"></div>10+</div>
      </div>
    </div>

    <div id="info-panel">
      <div class="panel-empty">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <span>Click any region to see details</span>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    let map, geojsonLayer, currentSelectedLayer = null;

    window.addEventListener('DOMContentLoaded', () => {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('toggle-icon').textContent = isDark ? '☀️' : '🌙';
      document.getElementById('toggle-label').textContent = isDark ? 'Light' : 'Dark';
    });

    function parseCSVData(text) {
      const lines = text.split(/\r?\n/);
      if (lines.length === 0) return [];
      
      const headers = lines[0].replace(/^\uFEFF/, '').split(',').map(h => h.trim());
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        
        const columns = line.split(',').map(c => c.trim());
        const record = {};
        headers.forEach((header, idx) => {
          record[header] = columns[idx] || '';
        });
        rows.push(record);
      }
      return rows;
    }

    function formatMultiValue(val) {
      if (!val || val.trim() === '') return 'Not Specified';
      if (!val.includes(';')) return val;
      return val.split(';')
                .map(item => `<div class="multi-item">${item.trim()}</div>`)
                .join('');
    }

    // Direct string execution injection workaround for dynamic SVG paths
    function getFeatureColor(count) {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        return count === 0 ? '#1a2d40' :
               count === 1 ? '#3a2010' :
               count <= 3  ? '#6a3010' :
               count <= 6  ? '#8a2808' :
               count <= 9  ? '#a82010' :
                             '#c01020';
      } else {
        return count === 0 ? '#ede8dc' :
               count === 1 ? '#f5d87a' :
               count <= 3  ? '#e8a020' :
               count <= 6  ? '#d4620a' :
               count <= 9  ? '#b83210' :
                             '#7a1020';
      }
    }

    function styleFeat(feature) {
      const count = feature.properties.telescopeCount || 0;
      return {
        fillColor: getFeatureColor(count),
        weight: 1.25,
        opacity: 1,
        color: 'var(--border)',
        fillOpacity: 0.85
      };
    }

    function buildTooltip(props) {
      const count = props.telescopeCount || 0;
      const counterLabel = count === 0 ? `<span class="tt-empty">No telescopes yet</span>` : `● ${count} Telescope${count !== 1 ? 's' : ''}`;
      return `<div class="tt-name">${props.districtName}</div>
              <div class="tt-counts">${counterLabel}</div>`;
    }

    function updateInfoPanel(props) {
      const panel = document.getElementById('info-panel');
      if (!props) {
        panel.classList.remove('active');
        panel.innerHTML = `
          <div class="panel-empty">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <span>Click any region to see details</span>
          </div>`;
        return;
      }

      panel.classList.add('active');
      const count = props.telescopeCount || 0;
      const isZero = count === 0;

      let subContent = '';
      if (isZero) {
        subContent = `
          <div class="panel-no-data">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>No telescopes assigned yet</span>
          </div>`;
      } else {
        subContent = `
          <div class="details-grid">
            <div class="detail-card">
              <div class="detail-lbl">Telescope Model</div>
              <div class="detail-value">${formatMultiValue(props.telescopeModel)}</div>
            </div>
            <div class="detail-card">
              <div class="detail-lbl">Contact Person</div>
              <div class="detail-value">${formatMultiValue(props.contactPerson)}</div>
            </div>
            <div class="detail-card">
              <div class="detail-lbl">Contact Number</div>
              <div class="detail-value">${formatMultiValue(props.contactNumber)}</div>
            </div>
          </div>`;
      }

      panel.innerHTML = `
        <div class="panel-top">
          <div>
            <div class="panel-name">${props.districtName}</div>
            <div class="panel-div">Division: ${props.division} · Area: ${props.area ? props.area.toLocaleString() : 'N/A'} km²</div>
          </div>
          <span class="pill-badge ${isZero ? 'zero' : 'active'}">${count} ${count === 1 ? 'Telescope' : 'Telescopes'}</span>
        </div>
        ${subContent}`;
    }

    function highlight(e) {
      const layer = e.target;
      layer.setStyle({ weight: 2.25, color: 'var(--border-hi)', fillOpacity: 0.95 });
      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) { layer.bringToFront(); }
    }

    function reset(e) {
      geojsonLayer.resetStyle(e.target);
    }

    function onClick(e) {
      const layer = e.target;
      if (currentSelectedLayer === layer) {
        currentSelectedLayer = null;
        updateInfoPanel(null);
      } else {
        currentSelectedLayer = layer;
        updateInfoPanel(layer.feature.properties);
        map.fitBounds(layer.getBounds().pad(0.12));
      }
    }

    function onEachFeature(feature, layer) {
      layer.bindTooltip(buildTooltip(feature.properties), {
        sticky: true, direction: 'top', offset: [0, -6]
      });
      layer.on({ mouseover: highlight, mouseout: reset, click: onClick });
    }

    Promise.all([
      fetch('bangladesh.geojson').then(res => { 
        if (!res.ok) throw new Error(`Failed to load 'bangladesh.geojson' (Server Response: ${res.status} ${res.statusText})`); 
        return res.json(); 
      }),
      fetch('telescopes.csv').then(res => { 
        if (!res.ok) throw new Error(`Failed to load 'telescopes.csv' (Server Response: ${res.status} ${res.statusText})`); 
        return res.text(); 
      })
    ]).then(([spatialGeoJson, relationalCsvText]) => {
      const parsedCsvRecords = parseCSVData(relationalCsvText);
      const crossReferenceMap = {};
      
      parsedCsvRecords.forEach(row => {
        if(row.districtName) {
          crossReferenceMap[row.districtName.toLowerCase().trim()] = row;
        }
      });

      let calculatedTelescopesTotal = 0;
      let registeredCoveredDistrictsCount = 0;

      spatialGeoJson.features.forEach(feature => {
        const lookupKey = (feature.properties.districtName || "").toLowerCase().trim();
        const csvRecordMatch = crossReferenceMap[lookupKey];

        if (csvRecordMatch) {
          const actualCount = parseInt(csvRecordMatch.telescopeCount, 10) || 0;
          feature.properties.telescopeCount = actualCount;
          feature.properties.telescopeModel = csvRecordMatch.telescopeModel || '';
          feature.properties.contactPerson  = csvRecordMatch.contactPerson || '';
          feature.properties.contactNumber  = csvRecordMatch.contactNumber || '';
          
          calculatedTelescopesTotal += actualCount;
          if (actualCount > 0) registeredCoveredDistrictsCount++;
        } else {
          feature.properties.telescopeCount = 0;
        }
      });

      document.getElementById('stat-total').innerText = calculatedTelescopesTotal;
      document.getElementById('stat-covered').innerText = `${registeredCoveredDistrictsCount}/64`;

      const BD_BOUNDS = L.latLngBounds([20.4, 87.8], [26.9, 92.9]);
      map = L.map('map', {
        zoomSnap: 0.25,
        zoomDelta: 0.5,
        maxBounds: BD_BOUNDS.pad(0.12),
        maxBoundsViscosity: 1.0,
        zoomControl: true
      }).setView([23.685, 90.3563], 7);

      geojsonLayer = L.geoJSON(spatialGeoJson, {
        style: styleFeat,
        onEachFeature: onEachFeature
      }).addTo(map);

      map.fitBounds(geojsonLayer.getBounds().pad(0.06));

      const loader = document.getElementById('loading-overlay');
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 400);

    }).catch(err => {
      console.error(err);
      const loaderText = document.querySelector('.loading-text');
      if (loaderText) {
        loaderText.innerHTML = `<span style="color:#c0392b; font-weight:bold; font-size:1.2rem;">Initialization Connection Error</span><br><br>
        <strong>Details:</strong> ${err.message}<br><br>
        <small style="color:var(--text-muted); display:block; text-align:left; max-width:500px; margin:0 auto;">
          1. Check that filenames in your repository match exactly (Linux is case-sensitive: <code>telescopes.csv</code> is different from <code>Telescopes.csv</code>).<br>
          2. Ensure both data files exist directly in the root directory alongside your index.html file.
        </small>`;
      }
    });
  </script>
</body>
</html>
